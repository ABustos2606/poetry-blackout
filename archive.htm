<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive · AI Blackout Poetry</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .archive-list {
            max-width: 680px;
            margin: 0 auto 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .archive-entry {
            background: var(--paper-dark);
            border: 1px solid rgba(33, 28, 20, .18);
            border-radius: 6px;
            padding: 1.5rem;
            box-shadow: 0 8px 16px -12px rgba(20, 14, 4, .2);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            border-bottom: 1px dashed rgba(33, 28, 20, .15);
            padding-bottom: 0.5rem;
        }

        .entry-date {
            font-family: 'Special Elite', monospace;
            font-size: .85rem;
            color: var(--stamp);
        }

        .entry-book {
            font-size: .75rem;
            color: var(--filed);
            text-align: right;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entry-poem {
            font-family: 'Source Serif 4', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--ink);
            white-space: pre-wrap;
            text-align: center;
            font-style: italic;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            font-family: 'Special Elite', monospace;
            color: var(--filed);
            border: 1px dashed rgba(33, 28, 20, .3);
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="desk">
        <h1 class="title">
            Archive<span class="redact-letter">_</span>
        </h1>
        <p class="subtitle">
            A permanent record of past poems generated by the machine, extracted from the public domain.
        </p>

        <div class="folder-tab">
            <span>
                Exhibit · Gutenberg Archive
                <span style="margin: 0 8px; opacity: 0.5;">|</span>
                <a href="index.htm" style="color: inherit; text-decoration: none;">View Today's Poem</a>
            </span>
        </div>

        <div class="control-card">
            <div id="archiveContainer" class="archive-list">
                <!-- Archive entries will be injected here -->
                <div class="empty-state">Loading archives...</div>
            </div>
        </div>

        <footer>
            <p>Archive updated daily at midnight UTC.</p>
        </footer>
    </div>

    <script src="archive.js"></script>
</body>
</html>
